spring.application.name=pushNotification
server.port=8080

# ==============================================================================
# Environment Configuration
# Automatically imports key-value pairs from .env file located at root
# ==============================================================================
spring.config.import=optional:file:.env[.properties]

# ==============================================================================
# MongoDB Atlas (Cloud) Configuration
# spring.mongodb.uri is used by Spring Boot 4.x
# spring.data.mongodb.uri is used by Spring Boot 3.x
# ==============================================================================
spring.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.auto-index-creation=true
